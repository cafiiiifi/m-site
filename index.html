<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>엠대리운전</title>
  <style>
    /* 기본 리셋 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      overflow-x: hidden;
      background-color: #ffffff;
    }

    /* 모든 이미지 크기 스마트폰 자동 재조정 */
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* ==========================================
       SECTION 1: 메인 화면 (히어로 섹션)
       ========================================== */
    .hero-section {
      position: relative;
      width: 100%;
      height: 100vh;
      background: linear-gradient(180deg, #0b1d3a 0%, #1a3c6d 100%);
      overflow: hidden;
    }

    /* 별똥별 애니메이션 */
    .hero-section::before {
      content: '';
      position: absolute;
      top: 10%;
      right: -100px;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,1), rgba(255,255,255,0));
      transform: rotate(-35deg);
      animation: shootingStar 6s infinite ease-in-out 2s;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
    }

    @keyframes shootingStar {
      0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
      10% { opacity: 1; }
      20% { transform: translate(-600px, 400px) rotate(-35deg); opacity: 0; }
      100% { opacity: 0; }
    }

    /* 달 (왼쪽 위) */
    .item-moon {
      position: absolute;
      top: 5%;
      left: 5%;
      width: 80px;
      height: 80px;
      z-index: 2;
      opacity: 0.9;
      filter: drop-shadow(0 0 15px rgba(255, 255, 200, 0.5));
    }

    /* 반짝이는 별 컨테이너 */
    .stars-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      pointer-events: none;
      z-index: 1;
    }
    
    .star {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      filter: blur(1px);
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* 오브젝트 공통 */
    .item {
      position: absolute;
      z-index: 3;
    }

    /* [PC 기본 세팅] */
    .item-tree {
      left: 2%;
      bottom: 12%;
      width: 320px;
      transform-origin: bottom center;
      animation: swayTree 8s infinite ease-in-out;
    }
    @keyframes swayTree {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1deg); }
    }

    .item-lantern {
      left: 10%;
      top: 48%;
      width: 60px;
      transform-origin: top center;
      animation: swingLantern 3.5s infinite ease-in-out;
    }
    @keyframes swingLantern {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    /* 그네 우측 그룹 */
    .swing-group {
      position: absolute;
      right: 5%;
      top: 0;
      width: 280px;
      height: 80%;
      z-index: 3;
    }

    .item-swing {
      position: absolute;
      right: 0;
      top: 0; 
      width: 240px;
      height: 100%;
      transform-origin: top center;
      animation: swingMotion 5s infinite ease-in-out;
    }

    .item-character {
      position: absolute;
      right: 10px;
      bottom: 25%;
      width: 180px;
      transform-origin: bottom center;
      animation: characterBounce 5s infinite ease-in-out;
    }

    .item-bag {
      position: absolute;
      right: 170px;
      bottom: 35%;
      width: 60px;
      transform-origin: bottom center;
      animation: bagBounce 5s infinite ease-in-out;
    }

    @keyframes swingMotion {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes characterBounce {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-2px); }
    }
    @keyframes bagBounce {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-3px); }
    }

    /* 하단 구름 */
    .cloud-layer {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 20%;
      z-index: 4;
    }
    .cloud-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* ==========================================
       SECTION 2: 하단 카드 & QR 섹션
       ========================================== */
    .info-section {
      width: 100%;
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .cards-container {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      max-width: 1000px;
      width: 100%;
      margin-bottom: 40px;
    }

    .card {
      flex: 1;
      background: linear-gradient(180deg, #e0f4ff 0%, #ffffff 100%);
      border-radius: 30px;
      padding: 40px 15px 30px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 150, 255, 0.1);
      min-height: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-number {
      position: absolute;
      top: -25px;
      width: 55px;
      height: 55px;
      background-color: #6ed3ff;
      color: #ffffff;
      font-size: 26px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 150, 255, 0.2);
    }

    .card-text {
      margin-top: 45px;
      font-size: 22px;
      font-weight: 800;
      color: #1a2b4c;
      line-height: 1.4;
      word-break: keep-all;
    }

    .card-footer-pattern {
      margin-top: auto;
      font-size: 14px;
      color: #b2e4ff;
      letter-spacing: 4px;
    }

    /* QR 영역 */
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-bottom: 30px;
    }

    .qr-link-wrapper {
      text-decoration: none;
      color: inherit;
    }

    .qr-card-wrapper {
      padding: 15px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(110, 211, 255, 0.25);
      border: 3px solid #e0f4ff;
      animation: floatQR 4s infinite ease-in-out;
    }

    @keyframes floatQR {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .qr-image-box {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-badge {
      margin-top: 20px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #1b355a 0%, #0b1d3a 100%);
      border-radius: 50px;
      border: 2px solid #6ed3ff;
    }

    .qr-badge-text {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .qr-badge-highlight {
      color: #ffd700;
      font-size: 18px;
      font-weight: 900;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 900;
      color: #1b355a;
    }

    /* ==========================================
       [스마트폰 화면 맞춤 크기 최적화]
       ========================================== */
    @media (max-width: 768px) {
      .hero-section {
        height: 75vh; /* 스마트폰 높이에 최적화 */
        min-height: 480px;
      }

      .item-moon { 
        width: 45px; 
        height: 45px; 
      }
      
      /* 모바일용 이미지 크기 제한 */
      .item-tree { 
        width: 150px; 
        left: -10px; 
        bottom: 8%; 
      }
      .item-lantern { 
        width: 30px; 
        left: 20px; 
        top: 48%; 
      }

      .swing-group {
        right: -5px;
        width: 160px;
        height: 70%;
      }
      .item-swing { 
        width: 140px; 
      }
      .item-character { 
        width: 100px; 
        right: 5px; 
        bottom: 15%; 
      }
      .item-bag { 
        width: 35px; 
        right: 95px; 
        bottom: 25%; 
      }

      /* 하단 카드 박스 */
      .cards-container { 
        flex-direction: column; 
        gap: 40px; 
      }
      .card { 
        width: 100%; 
        max-width: 260px; 
        min-height: 220px; 
      }
      .card-text {
        font-size: 18px;
      }

      .qr-image-box { width: 120px; height: 120px; }
      .qr-badge-text { font-size: 13px; }
      .qr-badge-highlight { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- 히어로 섹션 (밤하늘) -->
  <section class="hero-section">
    <div class="stars-container" id="starsContainer"></div>

    <div class="item-moon">
      <img src="imagesmoon.png" alt="달" onerror="this.style.display='none'; parentNode.style.background='radial-gradient(circle, #fffbe0 0%, rgba(255,255,255,0) 70%)'; parentNode.style.borderRadius='50%';">
    </div>

    <!-- 좌측: 나무 & 전등 -->
    <div class="item item-tree">
      <img src="imagestree.png" alt="나무">
    </div>
    <div class="item item-lantern">
      <img src="imageslantern.png" alt="전등">
    </div>

    <!-- 우측: 그네, 캐릭터, 가방 -->
    <div class="swing-group">
      <div class="item-swing">
        <img src="imagesswing.png" alt="그네">
      </div>
      <div class="item-character">
        <img src="imagescharacter.png" alt="책 읽는 캐릭터">
      </div>
      <div class="item-bag">
        <img src="imagesbag.png" alt="가방">
      </div>
    </div>

    <div class="cloud-layer">
      <img src="imagescloud.png" alt="구름">
    </div>
  </section>

  <!-- 정보 섹션 (하단) -->
  <section class="info-section">
    <div class="cards-container">
      
      <div class="card">
        <div class="card-number">1</div>
        <div class="card-text">
          앱설치시<br>
          5,000원<br>
          적립
        </div>
        <div class="card-footer-pattern">✦ ✧ ✦</div>
      </div>

      <div class="card">
        <div class="card-number">2</div>
        <div class="card-text">
          이용시마다<br>
          10%<br>
          캐쉬백
        </div>
        <div class="card-footer-pattern">✦ ✧ ✦</div>
      </div>

      <div class="card">
        <div class="card-number">3</div>
        <div class="card-text">
          마일리지<br>
          현금 출금<br>
          가능
        </div>
        <div class="card-footer-pattern">✦ ✧ ✦</div>
      </div>

    </div>

    <!-- QR 코드 영역 -->
    <div class="qr-section">
      <a href="https://example.com" target="_blank" class="qr-link-wrapper">
        <div class="qr-card-wrapper">
          <div class="qr-image-box">
            <img src="imagesqr.png" alt="QR 코드" onerror="this.style.display='none'; this.parentNode.innerHTML='<div style=\'text-align:center; padding:10px; color:#888; font-size:12px; font-weight:bold;\'>QR 코드<br>(imagesqr.png)</div>';">
          </div>
        </div>
      </a>
      
      <div class="qr-badge">
        <span class="qr-badge-text">✨ QR코드 스캔 시 <span class="qr-badge-highlight">5,000원</span> 증정! 🎁</span>
      </div>
    </div>

    <h2 class="brand-title">-엠대리운전-</h2>
  </section>

  <script>
    const starsContainer = document.getElementById('starsContainer');
    const numberOfStars = 15;

    for (let i = 0; i < numberOfStars; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      
      const top = Math.random() * 100;
      const left = Math.random() * 100;
      const size = Math.random() * 3 + 2;
      const duration = Math.random() * 3 + 2;
      const delay = Math.random() * 5;

      star.style.top = `${top}%`;
      star.style.left = `${left}%`;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.animationDuration = `${duration}s`;
      star.style.animationDelay = `${delay}s`;

      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
