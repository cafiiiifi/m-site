<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>엠대리운전</title>
  <style>
    /* 기본 리셋 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      overflow-x: hidden;
      background-color: #ffffff;
    }

    /* ==========================================
       SECTION 1: 메인 화면 (고정 비율 히어로 섹션)
       ========================================== */
    .hero-container {
      width: 100%;
      background: linear-gradient(180deg, #0b1d3a 0%, #1a3c6d 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* [핵심] 가로세로 비율을 고정하는 무대 (Stage)
       1000px * 700px 기준으로 내부 레이아웃 비율 완벽 보정 */
    .hero-stage {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 1000 / 700; /* PC/기본 비율 고정 */
      overflow: hidden;
    }

    /* 별똥별 애니메이션 */
    .hero-stage::before {
      content: '';
      position: absolute;
      top: 10%;
      right: -100px;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,1), rgba(255,255,255,0));
      transform: rotate(-35deg);
      animation: shootingStar 6s infinite ease-in-out 2s;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
    }

    @keyframes shootingStar {
      0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
      10% { opacity: 1; }
      20% { transform: translate(-600px, 400px) rotate(-35deg); opacity: 0; }
      100% { opacity: 0; }
    }

    /* 달 (왼쪽 위) */
    .item-moon {
      position: absolute;
      top: 6%;
      left: 6%;
      width: 9%;
      aspect-ratio: 1 / 1;
      z-index: 2;
      opacity: 0.9;
      filter: drop-shadow(0 0 15px rgba(255, 255, 200, 0.5));
    }
    .item-moon img { width: 100%; height: 100%; object-fit: contain; }

    /* 반짝이는 별 컨테이너 */
    .stars-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      pointer-events: none;
      z-index: 1;
    }
    
    .star {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      filter: blur(1px);
      animation: twinkle linear infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* 오브젝트 공통 스타일 (% 기반 고정) */
    .stage-item {
      position: absolute;
      z-index: 3;
    }
    .stage-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* 1. 나무 */
    .item-tree {
      left: 1%;
      bottom: 12%;
      width: 38%;
      transform-origin: bottom center;
      animation: swayTree 8s infinite ease-in-out;
    }
    @keyframes swayTree {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1deg); }
    }

    /* 2. 전등 (나무에 정확히 귀속) */
    .item-lantern {
      left: 10.5%;
      top: 48%;
      width: 6.5%;
      transform-origin: top center;
      animation: swingLantern 3.5s infinite ease-in-out;
    }
    @keyframes swingLantern {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    /* 3. 우측 세트: 그네 + 캐릭터 + 가방 (통째로 묶어서 비율 고정) */
    .swing-group-stage {
      position: absolute;
      right: 4%;
      top: 0;
      width: 32%;
      height: 85%;
      z-index: 3;
    }

    .item-swing {
      position: absolute;
      right: 0;
      top: 0;
      width: 88%;
      height: 100%;
      transform-origin: top center;
      animation: swingMotion 5s infinite ease-in-out;
    }

    .item-character {
      position: absolute;
      right: 2%;
      bottom: 18%;
      width: 68%;
      transform-origin: bottom center;
      animation: characterBounce 5s infinite ease-in-out;
    }

    .item-bag {
      position: absolute;
      left: 0;
      bottom: 30%;
      width: 25%;
      transform-origin: bottom center;
      animation: bagBounce 5s infinite ease-in-out;
    }

    @keyframes swingMotion {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    @keyframes characterBounce {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-2px); }
    }
    @keyframes bagBounce {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-3px); }
    }

    /* 하단 구름 */
    .cloud-layer {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 22%;
      z-index: 4;
    }
    .cloud-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* ==========================================
       SECTION 2: 하단 내용 & QR 코드 섹션
       ========================================== */
    .info-section {
      width: 100%;
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
    }

    .cards-container {
      display: flex;
      gap: 25px;
      justify-content: center;
      align-items: center;
      max-width: 1100px;
      width: 100%;
      margin-bottom: 50px;
    }

    .card {
      flex: 1;
      background: linear-gradient(180deg, #e0f4ff 0%, #ffffff 100%);
      border-radius: 35px;
      padding: 50px 20px 40px;
      text-align: center;
      position: relative;
      box-shadow: 0 15px 35px rgba(0, 150, 255, 0.1);
      min-height: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 150, 255, 0.2);
    }

    .card-number {
      position: absolute;
      top: -35px;
      width: 70px;
      height: 70px;
      background-color: #6ed3ff;
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 150, 255, 0.2);
    }

    .card-text {
      margin-top: 60px;
      font-size: 26px;
      font-weight: 800;
      color: #1a2b4c;
      line-height: 1.4;
      word-break: keep-all;
    }

    .card-footer-pattern {
      margin-top: auto;
      font-size: 16px;
      color: #b2e4ff;
      letter-spacing: 5px;
    }

    /* QR 코드 섹션 */
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 40px;
    }

    .qr-link-wrapper {
      text-decoration: none;
      color: inherit;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .qr-card-wrapper {
      position: relative;
      padding: 20px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(110, 211, 255, 0.25);
      border: 3px solid #e0f4ff;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: floatQR 4s infinite ease-in-out;
      overflow: hidden;
      cursor: pointer;
    }

    .qr-card-wrapper::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -150%;
      width: 100%;
      height: 200%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: rotate(30deg);
      animation: shineQR 5s infinite;
    }

    @keyframes shineQR {
      0%, 70% { left: -150%; }
      100% { left: 150%; }
    }

    .qr-card-wrapper:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 45px rgba(0, 150, 255, 0.35);
    }

    @keyframes floatQR {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    .qr-image-box {
      width: 180px;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fcff;
    }

    .qr-image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .qr-badge {
      margin-top: 25px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #1b355a 0%, #0b1d3a 100%);
      border-radius: 50px;
      box-shadow: 0 8px 20px rgba(27, 53, 90, 0.25);
      border: 2px solid #6ed3ff;
      animation: pulseBadge 2.5s infinite ease-in-out;
    }

    @keyframes pulseBadge {
      0%, 100% {
        box-shadow: 0 8px 20px rgba(27, 53, 90, 0.25), 0 0 0 0 rgba(110, 211, 255, 0.4);
      }
      50% {
        box-shadow: 0 12px 28px rgba(27, 53, 90, 0.35), 0 0 0 10px rgba(110, 211, 255, 0);
      }
    }

    .qr-badge-text {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .qr-badge-highlight {
      color: #ffd700;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    .brand-title {
      font-size: 32px;
      font-weight: 900;
      color: #1b355a;
      letter-spacing: -1px;
    }

    /* ==========================================
       [모바일 세로 전용 비율 조정]
       ========================================== */
    @media (max-width: 768px) {
      /* 스마트폰에서는 무대를 살짝 더 세로감 있게 1000/900으로 전환 */
      .hero-stage {
        aspect-ratio: 1000 / 900;
      }

      .cards-container { 
        flex-direction: column; 
        gap: 50px; 
        margin-top: 30px; 
      }
      .card { 
        width: 100%; 
        max-width: 320px; 
        min-height: 300px; 
        padding: 40px 15px 30px;
      }
      .card-text {
        font-size: 22px;
        margin-top: 50px;
      }

      .qr-image-box { width: 140px; height: 140px; }
      .qr-badge { padding: 10px 18px; }
      .qr-badge-text { font-size: 15px; }
      .qr-badge-highlight { font-size: 17px; }
    }
  </style>
</head>
<body>

  <!-- 히어로 섹션 (고정 비율 무대 방식) -->
  <section class="hero-container">
    <div class="hero-stage">
      <div class="stars-container" id="starsContainer"></div>

      <div class="item-moon">
        <img src="imagesmoon.png" alt="달" onerror="this.style.display='none'; parentNode.style.background='radial-gradient(circle, #fffbe0 0%, rgba(255,255,255,0) 70%)'; parentNode.style.borderRadius='50%';">
      </div>

      <!-- 좌측: 나무 & 전등 세트 -->
      <div class="stage-item item-tree">
        <img src="imagestree.png" alt="나무">
      </div>
      <div class="stage-item item-lantern">
        <img src="imageslantern.png" alt="전등">
      </div>

      <!-- 우측: 그네, 캐릭터, 가방 통째로 비율 고정 -->
      <div class="swing-group-stage">
        <div class="item-swing">
          <img src="imagesswing.png" alt="그네">
        </div>
        <div class="item-character">
          <img src="imagescharacter.png" alt="책 읽는 캐릭터">
        </div>
        <div class="item-bag">
          <img src="imagesbag.png" alt="가방">
        </div>
      </div>

      <div class="cloud-layer">
        <img src="imagescloud.png" alt="구름">
      </div>
    </div>
  </section>

  <!-- 정보 섹션 (하단) -->
  <section class="info-section">
    <div class="cards-container">
      
      <div class="card">
        <div class="card-number">1</div>
        <div class="card-text">
          앱설치시<br>
          5,000원<br>
          적립
        </div>
        <div class="card-footer-pattern">✦ ✧ ✦</div>
      </div>

      <div class="card">
        <div class="card-number">2</div>
        <div class="card-text">
          이용시마다<br>
          10%<br>
          캐쉬백
        </div>
        <div class="card-footer-pattern">✦ ✧ ✦</div>
      </div>

      <div class="card">
        <div class="card-number">3</div>
        <div class="card-text">
          마일리지<br>
          현금 출금<br>
          가능
        </div>
        <div class="card-footer-pattern">✦ ✧ ✦</div>
      </div>

    </div>

    <!-- QR 코드 영역 -->
    <div class="qr-section">
      <!-- 💡 href="https://..." 부분에 이동할 URL 주소를 넣으세요 -->
      <a href="https://example.com" target="_blank" class="qr-link-wrapper">
        <div class="qr-card-wrapper">
          <div class="qr-image-box">
            <img src="imagesqr.png" alt="QR 코드" onerror="this.style.display='none'; this.parentNode.innerHTML='<div style=\'text-align:center; padding:15px; color:#888; font-size:13px; font-weight:bold;\'>QR 코드 이미지<br>(imagesqr.png)</div>';">
          </div>
        </div>
      </a>
      
      <div class="qr-badge">
        <span class="qr-badge-text">✨ QR코드 스캔 시 <span class="qr-badge-highlight">5,000원</span> 증정! 🎁</span>
      </div>
    </div>

    <h2 class="brand-title">-엠대리운전-</h2>
  </section>

  <script>
    const starsContainer = document.getElementById('starsContainer');
    const numberOfStars = 15;

    for (let i = 0; i < numberOfStars; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      
      const top = Math.random() * 100;
      const left = Math.random() * 100;
      const size = Math.random() * 3 + 2;
      const duration = Math.random() * 3 + 2;
      const delay = Math.random() * 5;

      star.style.top = `${top}%`;
      star.style.left = `${left}%`;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.animationDuration = `${duration}s`;
      star.style.animationDelay = `${delay}s`;

      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
